name: Windows build and policy tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 9.0.x
      - name: Build
        run: dotnet build src/WishGuard.csproj -c Release -o artifacts/app
      - name: Build local lifecycle probe (does not register tasks)
        run: dotnet build tests/LifecycleProbe/LifecycleProbe.csproj -c Release
      - name: Policy and persistence tests (OCR explicitly excluded)
        shell: pwsh
        run: |
          $process = Start-Process artifacts/app/WishGuard.exe -ArgumentList @('--self-test', '--skip-ocr', '--data', "$PWD/test-results", '--report', "$PWD/test-results/results.json") -PassThru -Wait -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Self-tests failed: $($process.ExitCode)" }
          $report = Get-Content test-results/results.json -Raw | ConvertFrom-Json
          if (-not $report.passed) { throw 'Self-test report is not passing.' }
          $report.results | Format-Table name, pass, skipped
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Reviewer signing checks (temporary keys only)
        run: |
          python -m pip install -r tools/requirements.txt
          python -m unittest discover -s tools -p test_authority.py -v
